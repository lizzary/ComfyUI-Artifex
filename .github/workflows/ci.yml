name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy Pillow aiohttp
      - run: python scripts/verify_bundle.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.mjs
      - name: Exercise bundled Artifex
        run: python -c "import runpy; runpy.run_path('tests/smoke_backend.py', run_name='__main__')"
